      for (let i = 0; i <= 40; i++) {

        const x = Math.cos(a) * r, y = Math.sin(a) * r * 0.92;
        i ? c.lineTo(x, y) : c.moveTo(x, y);
      }
      c.closePath(); c.fillStyle = '#fffdf5'; c.fill(); c.strokeStyle = '#e9dcc0'; c.lineWidth = 0.05; c.stroke();
      const g = c.createRadialGradient(-0.02, -0.14, 0.05, 0.06, -0.04, 0.42);
      g.addColorStop(0, '#ffe58a'); g.addColorStop(0.6, '#ffc42e'); g.addColorStop(1, '#ee9a0c');
      circ(c, 0.06, -0.04, 0.4); c.fillStyle = g; c.fill();
      c.fillStyle = 'rgba(255,255,255,0.75)'; ell(c, -0.07, -0.18, 0.11, 0.06); c.fill();
      break;
    }
    case 5: { // 송송 썬 파
      for (const [x, y, r] of [[-0.5, -0.45, 0.33], [0.5, -0.48, 0.28], [0, 0.02, 0.52], [-0.5, 0.52, 0.3], [0.52, 0.45, 0.34]]) {
        circ(c, x, y, r); c.fillStyle = '#58b947'; c.fill(); c.strokeStyle = '#2c7a28'; c.lineWidth = 0.05; c.stroke();
        circ(c, x, y, r * 0.62); c.fillStyle = '#d4f2bd'; c.fill(); c.strokeStyle = '#86cf6d'; c.lineWidth = 0.035; c.stroke();
        circ(c, x, y, r * 0.24); c.fillStyle = '#a5dd8b'; c.fill();
      }
      break;
    }
    case 6: { // 어묵
      c.beginPath();
      for (let i = 0; i <= 40; i++) { const a = i / 40 * Math.PI * 2, r = i % 2 ? 0.82 : 0.92; const x = Math.cos(a) * r, y = Math.sin(a) * r; i ? c.lineTo(x, y) : c.moveTo(x, y); }
      c.closePath(); c.fillStyle = '#fff8fa'; c.fill(); c.strokeStyle = '#f1c4d4'; c.lineWidth = 0.03; c.stroke();
      c.beginPath();
      for (let k = 0; k <= 80; k++) { const th = k / 80 * Math.PI * 4, r = 0.05 + 0.58 * th / (Math.PI * 4); const x = Math.cos(th) * r, y = Math.sin(th) * r; k ? c.lineTo(x, y) : c.moveTo(x, y); }
      c.strokeStyle = '#ef5a97'; c.lineWidth = 0.14; c.lineCap = 'round'; c.stroke();
      break;
    }
    case 7: { // 만능 스프
      packetPath(c, 0.68, 0.9, 8); c.fillStyle = lgrad(c, -0.9, 0.9, '#fbfcff', '#9aa3b2'); c.fill();
      c.save(); packetPath(c, 0.68, 0.9, 8); c.clip();
      c.fillStyle = 'rgba(255,255,255,0.5)'; c.beginPath(); c.moveTo(-0.8, 0.3); c.lineTo(0.1, -1); c.lineTo(0.3, -1); c.lineTo(-0.6, 0.3); c.fill();
      c.fillStyle = '#e23b22'; c.fillRect(-1, -0.62, 2, 0.16);
      c.restore();
      const g = c.createRadialGradient(-0.08, 0.1, 0.04, 0, 0.2, 0.42);
      g.addColorStop(0, '#ffb15c'); g.addColorStop(1, '#d4321b');
      c.beginPath(); c.moveTo(-0.45, 0.55); c.quadraticCurveTo(0, -0.2, 0.45, 0.55); c.closePath(); c.fillStyle = g; c.fill();
      sparkle(c, 0.38, -0.25, 0.2, '#ffe36b');
      sparkle(c, -0.36, -0.05, 0.12, '#ffffff');
      break;
    }
  }
}

/* =====================================================================
   4. 스킨 정의

const SKINS = {
  gem: {
    label: '보석', title: '보석 세공소', item: '보석', colors: GEM_COLORS,
    guide: [
      ['4개 맞추기', '줄 보석이 생겨요. 터지면 한 줄을 통째로 지웁니다.'],
      ['ㄱ·ㅗ 모양', '폭탄 보석이 생겨요. 주변 3×3을 지웁니다.'],
      ['5개 맞추기', '은빛 다이아몬드. 보석과 바꾸면 그 색을 모두 지웁니다.'],
    ],
    sprite(c, t, S) {
      const R = S * 0.37, { out } = gemShape(t);
      for (let i = 16; i >= 1; i--) {
        c.save(); c.translate(S / 2 + i * S * 0.011, S / 2 + i * S * 0.011); c.scale(R, R);
        poly(c, out); c.fillStyle = 'rgba(25,35,70,0.03)'; c.fill(); c.restore();
      }
      c.save(); c.translate(S / 2, S / 2); c.scale(R, R); drawGem(c, t); c.restore();
    },
  },
  ramen: {
    label: '라면', title: '라면 한 판', item: '라면', colors: RAMEN_COLORS,
    guide: [
      ['4개 맞추기', '줄 라면이 생겨요. 터지면 한 줄을 통째로 지웁니다.'],
      ['ㄱ·ㅗ 모양', '폭탄 라면이 생겨요. 주변 3×3을 지웁니다.'],
      ['5개 맞추기', '만능 스프가 생겨요. 다른 라면과 바꾸면 그 종류를 모두 지웁니다.'],
    ],
    sprite(c, t, S) {
      const R = S * 0.4, [gr, gg, gb] = RAMEN_COLORS[t];
      const glow = c.createRadialGradient(S / 2, S / 2 + R * 0.6, 0, S / 2, S / 2 + R * 0.6, R * 1.1);
      glow.addColorStop(0, `rgba(${gr},${gg},${gb},0.28)`); glow.addColorStop(1, `rgba(${gr},${gg},${gb},0)`);
      c.fillStyle = glow; c.fillRect(0, 0, S * 1.32, S * 1.32);
      c.save(); c.translate(S / 2, S / 2); c.scale(R, R); drawRamen(c, t); c.restore();
    },
  },
};

/* =====================================================================
   5. 게임 엔진 (React 밖에서 캔버스를 직접 그림)
      onHud: 점수판 상태를 React로 전달, onOver: 클리어/실패 창 전달
   ===================================================================== */
function createGame(cv, board, { skin: skinName, onHud, onOver }) {
  const ctx = cv.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SPR = 1.32;
  let skin = SKINS[skinName], S = 60, W = 480, dpr = 1, sprites = [];
  let grid = [], dying = [], particles = [], effects = [], floats = [];
  let level = 1, score = 0, target = targetFor(1), moves = MOVES, best = 1;
  let busy = false, over = false, sel = null, down = null, hint = null, idleT = performance.now();
  let soundOn = true, actx = null, raf = 0, alive = true;
  let col = {};
  try { best = parseInt(localStorage.getItem('gem-best') || '1', 10) || 1; } catch (e) {}

  const key = (r, c) => r * N + c;
  const rnd = n => Math.floor(Math.random() * n);
  const newGem = (t, r, c, sp = null) => ({ t, sp, x: c, y: r, vy: 0, lin: false, pop: 1 });
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const hud = () => onHud({ level, score, target, moves, best });

  function readColors() {
    const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
    col = { a: v('--cell-a'), b: v('--cell-b'), sel: v('--select'), ink: v('--ink'), accent: v('--accent'), panel: v('--panel') };
  }
  function buildSprites() {
    sprites = [];
    for (let t = 0; t <= BOMB; t++) {
      const oc = document.createElement('canvas');
      oc.width = oc.height = Math.ceil(S * SPR * dpr);
      const c = oc.getContext('2d'); c.scale(dpr, dpr);
      skin.sprite(c, t, S);
      sprites.push(oc);
    }
  }
  function resize() {
    W = Math.max(240, Math.floor(board.clientWidth - 20));
    S = W / N;
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width = Math.round(W * dpr); cv.height = Math.round(W * dpr);
    cv.style.height = W + 'px';
    buildSprites();
  }

  // ----- 판 만들기와 매치 판정 -----
  function initBoard() {
    for (let tries = 0; tries < 100; tries++) {
      grid = [];
      for (let r = 0; r < N; r++) {
        grid.push([]);
        for (let c = 0; c < N; c++) {
          let t;
          do { t = rnd(TYPES); } while (
            (c >= 2 && grid[r][c - 1].t === t && grid[r][c - 2].t === t) ||
            (r >= 2 && grid[r - 1][c].t === t && grid[r - 2][c].t === t) ||
            (r >= 1 && c >= 1 && grid[r - 1][c].t === t && grid[r][c - 1].t === t && grid[r - 1][c - 1].t === t));
          const g = newGem(t, r, c); g.y = r - N - 1 - (N - r) * 0.15; grid[r].push(g);
        }
      }
      if (findMove()) return;
    }
  }
  function findMatches() {
    const gs = [];
    for (let r = 0; r < N; r++) {
      let c = 0;
      while (c < N) {
        const g = grid[r][c];
        if (!g || g.t >= BOMB) { c++; continue; }
        let e = c + 1; while (e < N && grid[r][e] && grid[r][e].t === g.t) e++;
        if (e - c >= 3) { const cells = []; for (let i = c; i < e; i++) cells.push([r, i]); gs.push({ dir: 'h', t: g.t, cells }); }
        c = e;
      }
    }
    for (let c = 0; c < N; c++) {
      let r = 0;
      while (r < N) {
        const g = grid[r][c];
        if (!g || g.t >= BOMB) { r++; continue; }
        let e = r + 1; while (e < N && grid[e][c] && grid[e][c].t === g.t) e++;
        if (e - r >= 3) { const cells = []; for (let i = r; i < e; i++) cells.push([i, c]); gs.push({ dir: 'v', t: g.t, cells }); }
        r = e;
      }
    }
    for (let r = 0; r < N - 1; r++) for (let c = 0; c < N - 1; c++) {
      const g = grid[r][c];
      if (!g || g.t >= BOMB) continue;
      const a = grid[r][c + 1], b = grid[r + 1][c], d = grid[r + 1][c + 1];
      if (a && b && d && a.t === g.t && b.t === g.t && d.t === g.t)
        gs.push({ dir: 'sq', t: g.t, cells: [[r, c], [r, c + 1], [r + 1, c], [r + 1, c + 1]] });
    }
    return gs;
  }
  function findMove() {
    const sw = (a, b, cc, d) => { const t = grid[a][b]; grid[a][b] = grid[cc][d]; grid[cc][d] = t; };
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      for (const [dr, dc] of [[0, 1], [1, 0]]) {
        const r2 = r + dr, c2 = c + dc;
        if (r2 >= N || c2 >= N) continue;
        if (grid[r][c].sp === 'color' || grid[r2][c2].sp === 'color') return [[r, c], [r2, c2]];
        sw(r, c, r2, c2);
        const ok = findMatches().length > 0;
        sw(r, c, r2, c2);
        if (ok) return [[r, c], [r2, c2]];
      }
    }
    return null;
  }
  function settled() {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const g = grid[r][c];
      if (!g || g.lin || g.x !== c || g.y !== r) return false;
    }
    return true;
  }
  const settle = () => new Promise(res => { const f = () => (settled() || !alive) ? res() : requestAnimationFrame(f); f(); });

  // ----- 지우기, 특수 아이템, 떨어뜨리기 -----
  function mostCommonType() {
    const cnt = new Array(TYPES).fill(0);
    for (const row of grid) for (const g of row) if (g && g.t < BOMB) cnt[g.t]++;
    return cnt.indexOf(Math.max(...cnt));
  }
  function expand(set) {
    const queue = [...set], done = new Set();
    const add = (r, c) => { if (r < 0 || c < 0 || r >= N || c >= N || !grid[r][c]) return; const k = key(r, c); if (!set.has(k)) { set.add(k); queue.push(k); } };
    while (queue.length) {
      const k = queue.pop(), r = Math.floor(k / N), c = k % N, g = grid[r][c];
      if (!g || !g.sp || done.has(k)) continue;
      done.add(k);
      if (g.sp === 'row') { effects.push({ kind: 'row', i: r, t: 0, life: 0.4 }); for (let i = 0; i < N; i++) add(r, i); }
      else if (g.sp === 'col') { effects.push({ kind: 'col', i: c, t: 0, life: 0.4 }); for (let i = 0; i < N; i++) add(i, c); }
      else if (g.sp === 'area') { effects.push({ kind: 'ring', r, c, t: 0, life: 0.45 }); for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) add(r + dr, c + dc); }
      else if (g.sp === 'color') {
        const tt = mostCommonType();
        effects.push({ kind: 'ring', r, c, t: 0, life: 0.6, big: true });
        for (let rr = 0; rr < N; rr++) for (let cc = 0; cc < N; cc++) if (grid[rr][cc] && grid[rr][cc].t === tt) { add(rr, cc); effects.push({ kind: 'zap', r, c, r2: rr, c2: cc, t: 0, life: 0.35 }); }
      }
    }
  }
  async function clearCells(set, creates, combo) {
    expand(set);
    for (const cr of creates) set.delete(key(cr.r, cr.c));
    const gained = set.size * 10 * combo + creates.length * 30;
    score += gained;
    let sx = 0, sy = 0;
    for (const k of set) {
      const r = Math.floor(k / N), c = k % N, g = grid[r][c];
      if (!g) continue;
      sx += c; sy += r;
      dying.push({ t: g.t, sp: g.sp, x: g.x, y: g.y, life: 0 });
      if (!reduceMotion) for (let i = 0; i < 5; i++) {
        const a = Math.random() * Math.PI * 2, v = 1.5 + Math.random() * 3;
        particles.push({ x: c + 0.5, y: r + 0.5, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, life: 0, max: 0.5 + Math.random() * 0.3, col: skin.colors[g.t] });
      }
      grid[r][c] = null;
    }
    for (const cr of creates) { const g = newGem(cr.sp === 'color' ? BOMB : cr.t, cr.r, cr.c, cr.sp); g.pop = 0.3; grid[cr.r][cr.c] = g; }
    const n = Math.max(1, set.size);
    floats.push({ x: sx / n + 0.5, y: sy / n + 0.5, text: '+' + gained, t: 0, life: 0.9, size: 0.42 });
    if (combo > 1) floats.push({ x: N / 2, y: N / 2 - 0.4, text: '콤보 ×' + combo, t: 0, life: 1.1, size: 0.75, big: true });
    chime(combo, set.size);
    hud();
    await sleep(150);
    collapse();
    await settle();
  }
  async function resolve(swapCells, combo) {
    const groups = findMatches();
    if (!groups.length) return false;
    const set = new Set();
    groups.forEach(g => g.cells.forEach(([r, c]) => set.add(key(r, c))));
    const creates = [], used = new Set();
    const H = groups.filter(g => g.dir === 'h'), V = groups.filter(g => g.dir === 'v');
    for (const h of H) for (const v of V) {
      if (used.has(h) || used.has(v) || h.t !== v.t) continue;
      const shared = h.cells.find(([r, c]) => v.cells.some(([r2, c2]) => r2 === r && c2 === c));
      if (shared) {
        used.add(h); used.add(v);
        creates.push({ r: shared[0], c: shared[1], t: h.t, sp: (h.cells.length >= 5 || v.cells.length >= 5) ? 'color' : 'area' });
      }
    }
    for (const g of groups) {
      if (used.has(g) || g.dir === 'sq' || g.cells.length < 4) continue;
      let pos = null;
      if (swapCells) pos = g.cells.find(([r, c]) => swapCells.some(([a, b]) => a === r && b === c));
      if (!pos) pos = g.cells[Math.floor(g.cells.length / 2)];
      if (creates.some(cr => cr.r === pos[0] && cr.c === pos[1])) continue;
      creates.push({ r: pos[0], c: pos[1], t: g.t, sp: g.cells.length >= 5 ? 'color' : (g.dir === 'h' ? 'row' : 'col') });
    }
    await clearCells(set, creates, combo);
    return true;
  }
  function collapse() {
    for (let c = 0; c < N; c++) {
      let w = N - 1;
      for (let r = N - 1; r >= 0; r--) {
        if (grid[r][c]) { if (r !== w) { grid[w][c] = grid[r][c]; grid[r][c] = null; } w--; }
      }
      const m = w + 1;
      for (let r = w; r >= 0; r--) { const g = newGem(rnd(TYPES), r, c); g.y = r - m - 0.3; grid[r][c] = g; }
    }
  }
  async function cascade(combo) { while (alive && findMatches().length) { await resolve(null, combo); combo++; } }
  async function shuffle() {
    const gems = []; for (const row of grid) for (const g of row) gems.push(g);
    for (let tries = 0; tries < 300; tries++) {
      for (let i = gems.length - 1; i > 0; i--) { const j = rnd(i + 1); [gems[i], gems[j]] = [gems[j], gems[i]]; }
      for (let i = 0; i < gems.length; i++) grid[Math.floor(i / N)][i % N] = gems[i];
      if (!findMatches().length && findMove()) break;
    }
    gems.forEach(g => g.lin = true);
    await settle();
  }

  // ----- 한 번의 이동 -----
  async function trySwap(r1, c1, r2, c2) {
    busy = true; hint = null; idleT = performance.now();
    const a = grid[r1][c1], b = grid[r2][c2];
    grid[r1][c1] = b; grid[r2][c2] = a; a.lin = b.lin = true;
    await settle();
    if (a.sp === 'color' || b.sp === 'color') {
      moves--; hud();
      const set = new Set();
      if (a.sp === 'color' && b.sp === 'color') {
        for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) set.add(key(r, c));
        a.sp = b.sp = null;
        effects.push({ kind: 'ring', r: r2, c: c2, t: 0, life: 0.8, big: true });
      } else {
        const bomb = a.sp === 'color' ? a : b, other = bomb === a ? b : a;
        const [br, bc] = bomb === a ? [r2, c2] : [r1, c1];
        bomb.sp = null; set.add(key(br, bc));
        effects.push({ kind: 'ring', r: br, c: bc, t: 0, life: 0.6, big: true });
        for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
          const g = grid[r][c];
          if (g && g.t === other.t) {
            if (other.sp && g !== other) g.sp = other.sp === 'area' ? 'area' : (rnd(2) ? 'row' : 'col');
            set.add(key(r, c));
            effects.push({ kind: 'zap', r: br, c: bc, r2: r, c2: c, t: 0, life: 0.4 });
          }
        }
      }
      await clearCells(set, [], 1);
      await cascade(2);
    } else if (findMatches().length) {
      moves--; hud();
      await resolve([[r1, c1], [r2, c2]], 1);
      await cascade(2);
    } else {
      grid[r1][c1] = a; grid[r2][c2] = b; a.lin = b.lin = true;
      tone(160, 0.12, 'triangle', 0.08);
      await settle();
      busy = false; return;
    }
    busy = false;
    if (alive) afterMove();
  }
  function afterMove() {
    if (score >= target) {
      over = true;
      const bonus = moves * 50; score += bonus;
      if (level + 1 > best) { best = level + 1; try { localStorage.setItem('gem-best', String(best)); } catch (e) {} }
      hud();
      onOver({ title: '레벨 클리어!', text: moves ? `남은 이동 ${moves}회 보너스 +${bonus}점 · 최종 ${score}점` : `최종 ${score}점`, btn: '다음 레벨', next: level + 1 });
      fanfare();
    } else if (moves <= 0) {
      over = true;
      onOver({ title: '이동 횟수를 다 썼어요', text: `${score}점 / 목표 ${target}점`, btn: '다시 도전', next: level });
    } else if (!findMove()) {
      busy = true;
      floats.push({ x: N / 2, y: N / 2, text: `${skin.item}을 섞는 중`, t: 0, life: 1.2, size: 0.6, big: true });
      shuffle().then(() => { busy = false; });
    }
  }
  function startLevel(L) {
    level = L; target = targetFor(L); score = 0; moves = MOVES; over = false; busy = false;
    sel = null; hint = null; dying = []; particles = []; effects = []; floats = [];
    initBoard();
    idleT = performance.now();
    onOver(null);
    hud();
  }

  // ----- 소리 -----
  function ensureAudio() {
    if (actx || !soundOn) return;
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  function tone(f, dur, type = 'sine', vol = 0.12, delay = 0) {
    if (!soundOn || !actx) return;
    const t0 = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  const SCALE = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568];
  function chime(combo, n) {
    const f = SCALE[Math.min(combo - 1, SCALE.length - 1)];
    tone(f, 0.25, 'sine', 0.1); tone(f * 1.5, 0.3, 'triangle', 0.05, 0.05);
    if (n > 6) tone(f * 2, 0.35, 'sine', 0.05, 0.1);
  }
  function fanfare() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.35, 'triangle', 0.09, i * 0.11)); }

  // ----- 입력 -----
  function cellAt(e) {
    const rect = cv.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width * W, y = (e.clientY - rect.top) / rect.height * W;
    const c = Math.floor(x / S), r = Math.floor(y / S);
    return (r < 0 || c < 0 || r >= N || c >= N) ? null : { r, c };
  }
  const adj = (a, b) => Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;
  function onDown(e) {
    ensureAudio(); if (actx && actx.state === 'suspended') actx.resume();
    idleT = performance.now(); hint = null;
    if (busy || over) return;
    const p = cellAt(e); if (!p) return;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    if (sel && adj(sel, p)) { const s = sel; sel = null; down = null; trySwap(s.r, s.c, p.r, p.c); return; }
    if (sel && sel.r === p.r && sel.c === p.c) { sel = null; down = null; return; }
    sel = p; down = { r: p.r, c: p.c, x: e.clientX, y: e.clientY };
  }
  function onMove(e) {
    if (!down || busy || over) return;
    const rect = cv.getBoundingClientRect(), th = rect.width / N * 0.35;
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < th) return;
    let r2 = down.r, c2 = down.c;
    if (Math.abs(dx) > Math.abs(dy)) c2 += Math.sign(dx); else r2 += Math.sign(dy);
    const d = down; down = null; sel = null;
    if (r2 >= 0 && c2 >= 0 && r2 < N && c2 < N) trySwap(d.r, d.c, r2, c2);
  }
  const onUp = () => { down = null; };
  cv.addEventListener('pointerdown', onDown);
  cv.addEventListener('pointermove', onMove);
  cv.addEventListener('pointerup', onUp);
  cv.addEventListener('pointercancel', onUp);

  // ----- 그리기 -----
  function drawPiece(g, x, y, scale, alpha, now) {
    const spr = sprites[g.t]; if (!spr) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x * S + S / 2, y * S + S / 2);
    ctx.scale(scale, scale);
    ctx.drawImage(spr, -S / 2, -S / 2, S * SPR, S * SPR);
    if (g.sp === 'row' || g.sp === 'col') {
      ctx.save();
      if (g.sp === 'col') ctx.rotate(Math.PI / 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.92)'; ctx.lineCap = 'round'; ctx.lineWidth = S * 0.06;
      for (const o of [-0.13, 0.13]) { ctx.beginPath(); ctx.moveTo(-S * 0.22, o * S); ctx.lineTo(S * 0.22, o * S); ctx.stroke(); }
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      const k = S * 0.44, h = S * 0.1;
      poly(ctx, [[k, 0], [k - h * 1.3, -h], [k - h * 1.3, h]]); ctx.fill();
      poly(ctx, [[-k, 0], [-k + h * 1.3, -h], [-k + h * 1.3, h]]); ctx.fill();
      ctx.restore();
    } else if (g.sp === 'area') {
      const p = 0.5 + 0.5 * Math.sin(now / 180);
      ctx.strokeStyle = `rgba(255,255,255,${0.55 + 0.4 * p})`; ctx.lineWidth = S * 0.05;
      ctx.beginPath(); ctx.arc(0, 0, S * (0.4 + 0.03 * p), 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([S * 0.05, S * 0.07]);
      ctx.strokeStyle = 'rgba(255,220,120,0.9)'; ctx.lineWidth = S * 0.03;
      ctx.beginPath(); ctx.arc(0, 0, S * 0.47, now / 600, now / 600 + Math.PI * 2); ctx.stroke();
    } else if (g.sp === 'color') {
      const p = 0.5 + 0.5 * Math.sin(now / 220);
      ctx.globalAlpha = alpha * (0.35 + 0.35 * p);
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 4; i++) {
        const a = now / 900 + i * Math.PI / 2, rr = S * 0.42, cx = Math.cos(a) * rr, cy = Math.sin(a) * rr, s = S * 0.07;
        poly(ctx, [[cx, cy - s], [cx + s * 0.35, cy], [cx, cy + s], [cx - s * 0.35, cy]]); ctx.fill();
      }
    }
    ctx.restore();
  }
  let last = performance.now();
  function frame(now) {
    if (!alive) return;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const g = grid[r][c]; if (!g) continue;
      if (g.pop < 1) g.pop = Math.min(1, g.pop + dt * 4);
      if (g.lin) {
        const sp = 9 * dt, dx = c - g.x, dy = r - g.y;
        g.x = Math.abs(dx) <= sp ? c : g.x + Math.sign(dx) * sp;
        g.y = Math.abs(dy) <= sp ? r : g.y + Math.sign(dy) * sp;
        if (g.x === c && g.y === r) g.lin = false;
      } else {
        g.x = c;
        if (g.y < r) { g.vy += 55 * dt; g.y += g.vy * dt; if (g.y >= r) { g.y = r; g.vy = 0; } }
        else if (g.y > r) g.y = r;
      }
    }
    if (!busy && !over && !hint && now - idleT > 7000) hint = findMove();

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, W);
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      ctx.fillStyle = (r + c) % 2 ? col.b : col.a;
      ctx.fillRect(c * S, r * S, S, S);
    }
    if (sel) { ctx.fillStyle = col.sel; ctx.fillRect(sel.c * S, sel.r * S, S, S); }
    if (hint && !busy) {
      const p = 0.5 + 0.5 * Math.sin(now / 200);
      ctx.strokeStyle = col.accent; ctx.globalAlpha = 0.4 + 0.6 * p; ctx.lineWidth = 3;
      for (const [r, c] of hint) ctx.strokeRect(c * S + 3, r * S + 3, S - 6, S - 6);
      ctx.globalAlpha = 1;
    }
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, W); ctx.clip();
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const g = grid[r][c]; if (!g) continue;
      let sc = g.pop < 1 ? 0.3 + 0.7 * g.pop + Math.sin(g.pop * Math.PI) * 0.25 : 1;
      if (sel && sel.r === r && sel.c === c) sc *= 1.08 + 0.03 * Math.sin(now / 120);
      drawPiece(g, g.x, g.y, sc, 1, now);
    }
    dying = dying.filter(d => (d.life += dt) < 0.28);
    for (const d of dying) { const k = d.life / 0.28; drawPiece(d, d.x, d.y, 1 + k * 0.35, 1 - k, now); }
    effects = effects.filter(f => (f.t += dt) < f.life);
    for (const f of effects) {
      const k = f.t / f.life, a = 1 - k;
      if (f.kind === 'row' || f.kind === 'col') {
        const th = S * (0.7 - 0.5 * k);
        ctx.fillStyle = `rgba(255,255,255,${0.75 * a})`;
        if (f.kind === 'row') ctx.fillRect(0, f.i * S + S / 2 - th / 2, W, th);
        else ctx.fillRect(f.i * S + S / 2 - th / 2, 0, th, W);
      } else if (f.kind === 'ring') {
        ctx.strokeStyle = `rgba(255,255,255,${0.9 * a})`; ctx.lineWidth = S * 0.12 * a + 1;
        ctx.beginPath(); ctx.arc(f.c * S + S / 2, f.r * S + S / 2, S * (0.3 + k * (f.big ? 3 : 1.4)), 0, Math.PI * 2); ctx.stroke();
      } else if (f.kind === 'zap') {
        ctx.strokeStyle = `rgba(255,255,255,${0.85 * a})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(f.c * S + S / 2, f.r * S + S / 2);
        const mx = (f.c + f.c2) / 2 * S + S / 2 + (Math.random() - 0.5) * S * 0.6, my = (f.r + f.r2) / 2 * S + S / 2 + (Math.random() - 0.5) * S * 0.6;
        ctx.lineTo(mx, my); ctx.lineTo(f.c2 * S + S / 2, f.r2 * S + S / 2); ctx.stroke();
      }
    }
    particles = particles.filter(p => (p.life += dt) < p.max);
    for (const p of particles) {
      p.vy += 9 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      const a = 1 - p.life / p.max, s = S * 0.09 * a + 1, x = p.x * S, y = p.y * S;
      ctx.fillStyle = `rgba(${p.col[0]},${p.col[1]},${p.col[2]},${a})`;
      poly(ctx, [[x, y - s], [x + s * 0.6, y], [x, y + s], [x - s * 0.6, y]]); ctx.fill();
    }
    ctx.restore();
    floats = floats.filter(f => (f.t += dt) < f.life);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const f of floats) {
      const k = f.t / f.life;
      ctx.globalAlpha = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
      ctx.font = `${Math.round(S * f.size)}px "Black Han Sans", "Malgun Gothic", sans-serif`;
      const y = (f.y - k * 0.8) * S;
      ctx.lineWidth = S * 0.09; ctx.strokeStyle = col.panel;
      ctx.strokeText(f.text, f.x * S, y);
      ctx.fillStyle = f.big ? col.accent : col.ink;
      ctx.fillText(f.text, f.x * S, y);
    }
    ctx.globalAlpha = 1;
    raf = requestAnimationFrame(frame);
  }

  // ----- 시작과 정리 -----
  const ro = new ResizeObserver(() => resize());
  ro.observe(board);
  const mq = matchMedia('(prefers-color-scheme: dark)');
  mq.addEventListener('change', readColors);
  const mo = new MutationObserver(readColors);
  mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'data-skin'] });
  readColors();
  resize();
  startLevel(1);
  raf = requestAnimationFrame(frame);

  return {
    startLevel,
    newGame() { if (!busy) startLevel(1); },
    showHint() { if (!busy && !over) { hint = findMove(); idleT = performance.now() - 60000; } },
    setSound(on) { soundOn = on; if (on) ensureAudio(); },
    setSkin(name) { skin = SKINS[name]; readColors(); buildSprites(); },
    destroy() {
      alive = false; cancelAnimationFrame(raf); ro.disconnect(); mo.disconnect();
      mq.removeEventListener('change', readColors);
      cv.removeEventListener('pointerdown', onDown); cv.removeEventListener('pointermove', onMove);
      cv.removeEventListener('pointerup', onUp); cv.removeEventListener('pointercancel', onUp);
      if (actx) actx.close();
    },
  };
}

/* =====================================================================
   6. React 화면
   ===================================================================== */
function loadSkin() {
  try { const s = localStorage.getItem('puzzle-skin'); return SKINS[s] ? s : 'ramen'; } catch (e) { return 'ramen'; }
}

function SkinSwitch({ value, onChange }) {
  return (
    <div className="skin-switch" role="group" aria-label="테마 선택">
      {Object.entries(SKINS).map(([id, s]) => (
        <button key={id} type="button" aria-pressed={value === id} onClick={() => onChange(id)}>{s.label}</button>
      ))}
    </div>
  );
}

function Stats({ hud }) {
  const pct = Math.min(100, hud.score / hud.target * 100);
  return (
    <div className="stats">
      <div>
        <div className="stat-label">점수 / 목표</div>
        <div className="stat-val">{hud.score.toLocaleString('ko-KR')} <small>/ {hud.target.toLocaleString('ko-KR')}</small></div>
        <div className="bar"><i style={{ width: pct + '%' }}></i></div>
      </div>
      <div className={'moves' + (hud.moves <= 5 ? ' low' : '')}>
        <div className="stat-label">남은 이동</div>
        <div className="stat-val">{hud.moves}</div>
      </div>
      <div>
        <div className="stat-label">최고 레벨</div>
        <div className="stat-val">{hud.best}</div>
      </div>
    </div>
  );
}

function Overlay({ over, onAction }) {
  const btnRef = useRef(null);
  useEffect(() => { if (over && btnRef.current) btnRef.current.focus(); }, [over]);
  if (!over) return null;
  return (
    <div className="overlay">
      <div className="card">
        <h2>{over.title}</h2>
        <p>{over.text}</p>
        <button ref={btnRef} className="primary" type="button" onClick={onAction}>{over.btn}</button>
      </div>
    </div>
  );
}

function Guide({ items }) {
  return (
    <div className="guide">
      {items.map(([title, text]) => <div key={title}><b>{title}</b>{text}</div>)}
    </div>
  );
}

function App() {
  const cvRef = useRef(null), boardRef = useRef(null), game = useRef(null);
  const [skinName, setSkinName] = useState(loadSkin);
  const [hud, setHud] = useState({ level: 1, score: 0, target: targetFor(1), moves: MOVES, best: 1 });
  const [over, setOver] = useState(null);
  const [sound, setSound] = useState(true);
  const skin = SKINS[skinName];

  // 스킨: 색 토큰과 캔버스 그림을 함께 바꿈 (게임 진행 상태는 유지)
  useEffect(() => {
    document.documentElement.dataset.skin = skinName;
    document.title = skin.title;
    try { localStorage.setItem('puzzle-skin', skinName); } catch (e) {}
    if (game.current) game.current.setSkin(skinName);
  }, [skinName]);

  // 게임 엔진은 처음 한 번만 만든다
  useEffect(() => {
    const g = createGame(cvRef.current, boardRef.current, { skin: skinName, onHud: setHud, onOver: setOver });
    game.current = g;
    return () => g.destroy();
  }, []);

  useEffect(() => { if (game.current) game.current.setSound(sound); }, [sound]);

  return (
    <div className="wrap">
      <header>
        <div>
          <h1>{skin.title}</h1>
          <p className="sub">같은 {skin.item} 3개 이상을 한 줄로, 또는 2×2 정사각형으로 맞추세요. 클릭하거나 밀어서 바꿉니다.</p>
        </div>
        <div className="head-right">
          <SkinSwitch value={skinName} onChange={setSkinName} />
          <span className="level-badge">레벨 {hud.level}</span>
        </div>
      </header>

      <Stats hud={hud} />

      <div className="board" ref={boardRef}>
        <canvas ref={cvRef} aria-label={`${skin.item} 게임판 8×8`}></canvas>
        <Overlay over={over} onAction={() => game.current.startLevel(over.next)} />
      </div>

      <div className="controls">
        <button type="button" onClick={() => game.current.newGame()}>처음부터</button>
        <button type="button" onClick={() => game.current.showHint()}>힌트 보기</button>
        <button type="button" aria-pressed={sound} onClick={() => setSound(s => !s)}>{sound ? '소리 켜짐' : '소리 꺼짐'}</button>
      </div>

      <Guide items={skin.guide} />
    </div>
  );
}

document.documentElement.dataset.skin = loadSkin();
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
