<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>라면 한 판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one centered column — title, stat strip, the 8×8 ramen tray, controls, a small guide.
   Deliberately single black theme (late-night ramen), same in light and dark. */
:root {
  --bg: #050505;
  --panel: #121212;
  --cell-a: #1a1a1a;
  --cell-b: #212121;
  --ink: #f6f0e6;
  --muted: #a39b8f;
  --line: #2b2925;
  --accent: #ff6a2b;
  --accent-ink: #160803;
  --select: rgba(255, 106, 43, 0.28);
  --font-display: "Black Han Sans", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --font-body: "Gowun Dodum", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 7vw, 38px); margin: 0; letter-spacing: 0.01em; line-height: 1; text-wrap: balance; }
.sub { color: var(--muted); margin: 6px 0 0; font-size: 14px; }
.level-badge { font-family: var(--font-display); font-size: 15px; background: var(--ink); color: var(--bg); padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
.stats { display: grid; grid-template-columns: 1fr auto auto; gap: 18px; align-items: end; }
.stat-label { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.stat-val { font-family: var(--font-display); font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stat-val small { font-family: var(--font-body); font-size: 13px; color: var(--muted); }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .35s ease; }
.moves.low .stat-val { color: #e2445c; }
.board { position: relative; background: var(--panel); border-radius: 18px; padding: 10px; box-shadow: 0 0 0 1px var(--line), 0 24px 60px -30px rgba(255, 106, 43, 0.35); }
canvas { display: block; width: 100%; height: auto; touch-action: none; cursor: pointer; border-radius: 10px; }
.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--panel) 78%, transparent); border-radius: 18px; backdrop-filter: blur(3px); }
.overlay[hidden] { display: none; }
.card { text-align: center; padding: 24px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.card h2 { font-family: var(--font-display); font-weight: 400; font-size: 34px; margin: 0; }
.card p { margin: 0; color: var(--muted); font-size: 16px; }
.controls { display: flex; gap: 10px; flex-wrap: wrap; }
button { font-family: var(--font-body); font-size: 15px; font-weight: 700; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 12px; padding: 10px 16px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.guide { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; font-size: 13px; color: var(--muted); }
.guide div { border-top: 1px solid var(--line); padding-top: 8px; min-width: 0; }
.guide b { display: block; color: var(--ink); font-size: 14px; margin-bottom: 2px; }
@media (max-width: 420px) { .stats { gap: 12px; } .stat-val { font-size: 20px; } .guide { grid-template-columns: 1fr; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>라면 한 판</h1>
      <p class="sub">같은 라면 3개 이상을 한 줄로, 또는 2×2 정사각형으로 맞추세요. 클릭하거나 밀어서 바꿉니다.</p>
    </div>
    <span class="level-badge" id="levelEl">레벨 1</span>
  </header>

  <div class="stats">
    <div>
      <div class="stat-label">점수 / 목표</div>
      <div class="stat-val"><span id="scoreEl">0</span> <small>/ <span id="targetEl">1000</span></small></div>
      <div class="bar"><i id="barEl"></i></div>
    </div>
    <div class="moves" id="movesBox">
      <div class="stat-label">남은 이동</div>
      <div class="stat-val" id="movesEl">25</div>
    </div>
    <div>
      <div class="stat-label">최고 레벨</div>
      <div class="stat-val" id="bestEl">1</div>
    </div>
  </div>

  <div class="board" id="board">
    <canvas id="cv" aria-label="라면 게임판 8×8"></canvas>
    <div class="overlay" id="overlay" hidden>
      <div class="card">
        <h2 id="ovTitle">레벨 클리어!</h2>
        <p id="ovText"></p>
        <button class="primary" id="ovBtn">다음 레벨</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="newBtn">처음부터</button>
    <button id="hintBtn">힌트 보기</button>
    <button id="soundBtn" aria-pressed="true">소리 켜짐</button>
  </div>

  <div class="guide">
    <div><b>4개 맞추기</b>줄 라면이 생겨요. 터지면 한 줄을 통째로 지웁니다.</div>
    <div><b>ㄱ·ㅗ 모양</b>폭탄 라면이 생겨요. 주변 3×3을 지웁니다.</div>
    <div><b>5개 맞추기</b>만능 스프가 생겨요. 다른 라면과 바꾸면 그 종류를 모두 지웁니다.</div>
  </div>
</div>

<script>
(() => {
const N = 8, TYPES = 7, MOVES = 25, BOMB = 7;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- ramen pieces (unit coords, y down, roughly -1..1) ----------
const COLORS = [
  [229, 50, 45],   // 0 spicy packet ramen
  [70, 130, 230],  // 1 cup ramen
  [242, 182, 48],  // 2 yellow pot (양은냄비)
  [120, 80, 45],   // 3 jjajang ramen bowl
  [255, 214, 90],  // 4 fried egg
  [90, 190, 80],   // 5 green onion
  [240, 110, 160], // 6 fish cake
  [210, 215, 225], // 7 all-purpose soup packet (bomb)
];
function lgrad(c, y0, y1, a, b) { const g = c.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, a); g.addColorStop(1, b); return g; }
function ell(c, x, y, rx, ry) { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); }
function noodles(c, x0, x1, y, rows, amp, col, lw) {
  c.strokeStyle = col; c.lineWidth = lw; c.lineCap = 'round'; c.lineJoin = 'round';
  for (let i = 0; i < rows; i++) {
    c.beginPath();
    const yy = y + i * amp * 1.7;
    for (let k = 0; k <= 32; k++) {
      const x = x0 + (x1 - x0) * k / 32, py = yy + Math.sin(k / 32 * Math.PI * 7 + i * 1.3) * amp;
      k ? c.lineTo(x, py) : c.moveTo(x, py);
    }
    c.stroke();
  }
}
function packetPath(c, w, h, teeth) {
  const tw = 2 * w / teeth, th = 0.07;
  c.beginPath(); c.moveTo(-w, -h + th);
  for (let i = 0; i < teeth; i++) { c.lineTo(-w + tw * (i + 0.5), -h); c.lineTo(-w + tw * (i + 1), -h + th); }
  c.lineTo(w, h - th);
  for (let i = teeth - 1; i >= 0; i--) { c.lineTo(-w + tw * (i + 0.5), h); c.lineTo(-w + tw * i, h - th); }
  c.closePath();
}
function sparkle(c, x, y, s, col) {
  c.fillStyle = col; c.beginPath();
  c.moveTo(x, y - s); c.quadraticCurveTo(x, y, x + s, y); c.quadraticCurveTo(x, y, x, y + s);
  c.quadraticCurveTo(x, y, x - s, y); c.quadraticCurveTo(x, y, x, y - s); c.fill();
}

function drawRamen(c, t) {
  switch (t) {
    case 0: { // spicy packet ramen
      packetPath(c, 0.78, 0.95, 9);
      c.fillStyle = lgrad(c, -1, 1, '#ff5a45', '#b3191b'); c.fill();
      c.save(); packetPath(c, 0.78, 0.95, 9); c.clip();
      c.fillStyle = '#7d0f12'; c.fillRect(-1, -1, 2, 0.5);
      c.fillStyle = 'rgba(255,255,255,0.16)'; c.beginPath(); c.moveTo(-0.9, 0.2); c.lineTo(-0.2, -1); c.lineTo(0.05, -1); c.lineTo(-0.65, 0.2); c.fill();
      c.restore();
      // chili on the band
      c.save(); c.translate(0.02, -0.72); c.rotate(-0.35);
      ell(c, 0, 0, 0.36, 0.1); c.fillStyle = '#ff7a3a'; c.fill();
      c.fillStyle = '#5fbf4a'; c.fillRect(0.3, -0.05, 0.14, 0.1);
      c.restore();
      // bowl window
      circ(c, 0, 0.22, 0.5); c.fillStyle = '#fff3dc'; c.fill();
      c.save(); circ(c, 0, 0.22, 0.5); c.clip();
      c.fillStyle = '#e8492a'; c.fillRect(-0.6, 0.34, 1.2, 0.5);
      noodles(c, -0.5, 0.5, -0.05, 4, 0.06, '#f2b23a', 0.075);
      c.restore();
      circ(c, 0, 0.22, 0.5); c.strokeStyle = '#ffd36a'; c.lineWidth = 0.06; c.stroke();
      break;
    }
    case 1: { // cup ramen
      c.beginPath(); c.moveTo(-0.78, -0.6); c.lineTo(0.78, -0.6); c.lineTo(0.56, 0.93); c.lineTo(-0.56, 0.93); c.closePath();
      c.fillStyle = lgrad(c, -0.6, 0.93, '#ffffff', '#cfd6e2'); c.fill();
      c.save(); c.clip();
      c.fillStyle = '#2f6fe0'; c.fillRect(-1, -0.18, 2, 0.46);
      c.fillStyle = '#1d4fb0'; c.fillRect(-1, 0.22, 2, 0.06);
      c.restore();
      circ(c, 0, 0.05, 0.15); c.fillStyle = '#ffd34d'; c.fill();
      ell(c, 0, -0.6, 0.86, 0.2); c.fillStyle = '#eef1f6'; c.fill(); c.strokeStyle = '#a9b2c2'; c.lineWidth = 0.05; c.stroke();
      c.beginPath(); c.moveTo(0.18, -0.7); c.lineTo(0.92, -0.98); c.lineTo(0.8, -0.58); c.closePath(); c.fillStyle = '#c9d1de'; c.fill();
      // steam
      c.strokeStyle = 'rgba(255,255,255,0.55)'; c.lineWidth = 0.05; c.lineCap = 'round';
      for (const x of [-0.35, -0.05]) { c.beginPath(); c.moveTo(x, -0.82); c.bezierCurveTo(x - 0.12, -0.9, x + 0.12, -0.95, x, -1.05); c.stroke(); }
      break;
    }
    case 2: { // yellow pot
      c.fillStyle = '#b07a0c';
      c.beginPath(); c.roundRect(-1.0, -0.32, 0.26, 0.14, 0.05); c.fill();
      c.beginPath(); c.roundRect(0.74, -0.32, 0.26, 0.14, 0.05); c.fill();
      c.beginPath(); c.moveTo(-0.85, -0.25); c.lineTo(-0.85, 0.55); c.quadraticCurveTo(-0.85, 0.85, -0.55, 0.85);
      c.lineTo(0.55, 0.85); c.quadraticCurveTo(0.85, 0.85, 0.85, 0.55); c.lineTo(0.85, -0.25); c.closePath();
      c.fillStyle = lgrad(c, -0.3, 0.85, '#ffd95e', '#c4860f'); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.28)'; ell(c, -0.45, 0.25, 0.12, 0.3); c.fill(); ell(c, 0.4, 0.45, 0.1, 0.16); c.fill();
      ell(c, 0, -0.25, 0.85, 0.28); c.fillStyle = '#d9581c'; c.fill();
      c.save(); ell(c, 0, -0.25, 0.8, 0.24); c.clip();
      noodles(c, -0.85, 0.85, -0.38, 3, 0.05, '#ffe08a', 0.075);
      c.fillStyle = '#6ccf52'; for (const [x, y] of [[-0.3, -0.18], [0.25, -0.32], [0.45, -0.12]]) { circ(c, x, y, 0.06); c.fill(); }
      c.restore();
      ell(c, 0, -0.25, 0.85, 0.28); c.strokeStyle = '#ffe89a'; c.lineWidth = 0.06; c.stroke();
      break;
    }
    case 3: { // jjajang bowl
      c.fillStyle = '#c9c2b6'; c.fillRect(-0.32, 0.62, 0.64, 0.18);
      c.beginPath(); c.moveTo(-0.95, -0.12); c.bezierCurveTo(-0.88, 0.8, 0.88, 0.8, 0.95, -0.12); c.closePath();
      c.fillStyle = lgrad(c, -0.12, 0.7, '#ffffff', '#d6cfc3'); c.fill();
      c.beginPath(); c.moveTo(-0.88, 0.1); c.bezierCurveTo(-0.7, 0.42, 0.7, 0.42, 0.88, 0.1);
      c.strokeStyle = '#d23c2c'; c.lineWidth = 0.05; c.stroke();
      ell(c, 0, -0.12, 0.95, 0.3); c.fillStyle = '#f3efe7'; c.fill();
      ell(c, 0, -0.1, 0.8, 0.23); c.fillStyle = '#3a2312'; c.fill();
      c.save(); ell(c, 0, -0.1, 0.8, 0.23); c.clip();
      noodles(c, -0.8, 0.8, -0.22, 3, 0.04, '#e9b968', 0.06);
      ell(c, 0.05, -0.1, 0.5, 0.15); c.fillStyle = '#2a160a'; c.fill();
      c.restore();
      c.strokeStyle = '#86d063'; c.lineWidth = 0.06; c.lineCap = 'round';
      for (const [x, y] of [[-0.15, -0.16], [0.02, -0.2], [0.2, -0.14]]) { c.beginPath(); c.moveTo(x, y); c.lineTo(x + 0.1, y - 0.08); c.stroke(); }
      c.fillStyle = 'rgba(255,255,255,0.35)'; ell(c, -0.2, -0.16, 0.12, 0.03); c.fill();
      break;
    }
    case 4: { // fried egg
      c.beginPath();
      for (let i = 0; i <= 40; i++) {
        const a = i / 40 * Math.PI * 2, r = 0.88 * (1 + 0.06 * Math.sin(5 * a) + 0.04 * Math.sin(3 * a + 1));
        const x = Math.cos(a) * r, y = Math.sin(a) * r * 0.92;
        i ? c.lineTo(x, y) : c.moveTo(x, y);
      }
      c.closePath(); c.fillStyle = '#fffdf5'; c.fill(); c.strokeStyle = '#e9dcc0'; c.lineWidth = 0.05; c.stroke();
      const g = c.createRadialGradient(-0.02, -0.14, 0.05, 0.06, -0.04, 0.42);
      g.addColorStop(0, '#ffe58a'); g.addColorStop(0.6, '#ffc42e'); g.addColorStop(1, '#ee9a0c');
      circ(c, 0.06, -0.04, 0.4); c.fillStyle = g; c.fill();
      c.fillStyle = 'rgba(255,255,255,0.75)'; ell(c, -0.07, -0.18, 0.11, 0.06); c.fill();
      break;
    }
    case 5: { // green onion slices
      for (const [x, y, r] of [[-0.5, -0.45, 0.33], [0.5, -0.48, 0.28], [0, 0.02, 0.52], [-0.5, 0.52, 0.3], [0.52, 0.45, 0.34]]) {
        circ(c, x, y, r); c.fillStyle = '#58b947'; c.fill(); c.strokeStyle = '#2c7a28'; c.lineWidth = 0.05; c.stroke();
        circ(c, x, y, r * 0.62); c.fillStyle = '#d4f2bd'; c.fill(); c.strokeStyle = '#86cf6d'; c.lineWidth = 0.035; c.stroke();
        circ(c, x, y, r * 0.24); c.fillStyle = '#a5dd8b'; c.fill();
      }
      break;
    }
    case 6: { // fish cake slice with pink swirl
      c.beginPath();
      for (let i = 0; i <= 40; i++) { const a = i / 40 * Math.PI * 2, r = i % 2 ? 0.82 : 0.92; const x = Math.cos(a) * r, y = Math.sin(a) * r; i ? c.lineTo(x, y) : c.moveTo(x, y); }
      c.closePath(); c.fillStyle = '#fff8fa'; c.fill(); c.strokeStyle = '#f1c4d4'; c.lineWidth = 0.03; c.stroke();
      c.beginPath();
      for (let k = 0; k <= 80; k++) { const th = k / 80 * Math.PI * 4, r = 0.05 + 0.58 * th / (Math.PI * 4); const x = Math.cos(th) * r, y = Math.sin(th) * r; k ? c.lineTo(x, y) : c.moveTo(x, y); }
      c.strokeStyle = '#ef5a97'; c.lineWidth = 0.14; c.lineCap = 'round'; c.stroke();
      break;
    }
    case 7: { // all-purpose soup packet (bomb)
      packetPath(c, 0.68, 0.9, 8);
      c.fillStyle = lgrad(c, -0.9, 0.9, '#fbfcff', '#9aa3b2'); c.fill();
      c.save(); packetPath(c, 0.68, 0.9, 8); c.clip();
      c.fillStyle = 'rgba(255,255,255,0.5)'; c.beginPath(); c.moveTo(-0.8, 0.3); c.lineTo(0.1, -1); c.lineTo(0.3, -1); c.lineTo(-0.6, 0.3); c.fill();
      c.fillStyle = '#e23b22'; c.fillRect(-1, -0.62, 2, 0.16);
      c.restore();
      const g = c.createRadialGradient(-0.08, 0.1, 0.04, 0, 0.2, 0.42);
      g.addColorStop(0, '#ffb15c'); g.addColorStop(1, '#d4321b');
      c.beginPath(); c.moveTo(-0.45, 0.55); c.quadraticCurveTo(0, -0.2, 0.45, 0.55); c.closePath(); c.fillStyle = g; c.fill();
      sparkle(c, 0.38, -0.25, 0.2, '#ffe36b');
      sparkle(c, -0.36, -0.05, 0.12, '#ffffff');
      break;
    }
  }
}
function poly(c, pts) { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.closePath(); }

// ---------- sprites ----------
let S = 60, W = 480, dpr = 1;
const SPR = 1.32; // sprite box in cells
let sprites = [];
function buildSprites() {
  sprites = [];
  const R = S * 0.4;
  for (let t = 0; t <= BOMB; t++) {
    const oc = document.createElement('canvas');
    oc.width = oc.height = Math.ceil(S * SPR * dpr);
    const c = oc.getContext('2d');
    c.scale(dpr, dpr);
    // warm under-glow so pieces lift off the black board
    const glow = c.createRadialGradient(S / 2, S / 2 + R * 0.6, 0, S / 2, S / 2 + R * 0.6, R * 1.1);
    const [gr, gg, gb] = COLORS[t];
    glow.addColorStop(0, `rgba(${gr},${gg},${gb},0.28)`); glow.addColorStop(1, `rgba(${gr},${gg},${gb},0)`);
    c.fillStyle = glow; c.fillRect(0, 0, S * SPR, S * SPR);
    c.save(); c.translate(S / 2, S / 2); c.scale(R, R); drawRamen(c, t); c.restore();
    sprites.push(oc);
  }
}

// ---------- state ----------
let grid = [], dying = [], particles = [], effects = [], floats = [];
let level = 1, score = 0, target = 1000, moves = MOVES, best = 1;
let busy = false, over = false, sel = null, down = null, hint = null, idleT = performance.now();
let soundOn = true, actx = null;
try { best = parseInt(localStorage.getItem('gem-best') || '1', 10) || 1; } catch (e) {}

const key = (r, c) => r * N + c;
const rnd = n => Math.floor(Math.random() * n);
function newGem(t, r, c, sp = null) { return { t, sp, x: c, y: r, vy: 0, lin: false, pop: 1 }; }
const targetFor = L => 1000 + (L - 1) * 450;

function initBoard() {
  for (let tries = 0; tries < 100; tries++) {
    grid = [];
    for (let r = 0; r < N; r++) {
      grid.push([]);
      for (let c = 0; c < N; c++) {
        let t;
        do { t = rnd(TYPES); } while ((c >= 2 && grid[r][c - 1].t === t && grid[r][c - 2].t === t) || (r >= 2 && grid[r - 1][c].t === t && grid[r - 2][c].t === t) || (r >= 1 && c >= 1 && grid[r - 1][c].t === t && grid[r][c - 1].t === t && grid[r - 1][c - 1].t === t));
        const g = newGem(t, r, c); g.y = r - N - 1 - (N - r) * 0.15; grid[r].push(g);
      }
    }
    if (findMove()) return;
  }
}

function findMatches() {
  const gs = [];
  for (let r = 0; r < N; r++) {
    let c = 0;
    while (c < N) {
      const g = grid[r][c];
      if (!g || g.t >= BOMB) { c++; continue; }
      let e = c + 1; while (e < N && grid[r][e] && grid[r][e].t === g.t) e++;
      if (e - c >= 3) { const cells = []; for (let i = c; i < e; i++) cells.push([r, i]); gs.push({ dir: 'h', t: g.t, cells }); }
      c = e;
    }
  }
  for (let c = 0; c < N; c++) {
    let r = 0;
    while (r < N) {
      const g = grid[r][c];
      if (!g || g.t >= BOMB) { r++; continue; }

  score += gained;
  let sx = 0, sy = 0;
  for (const k of set) {
    const r = Math.floor(k / N), c = k % N, g = grid[r][c];

async function resolve(swapCells, combo) {

    const shared = h.cells.find(([r, c]) => v.cells.some(([r2, c2]) => r2 === r && c2 === c));
    if (shared) {

    updateHUD();

}

// ---------- sound ----------

// ---------- input ----------

// ---------- sizing ----------
function resize() {

      ctx.beginPath(); ctx.moveTo(f.c * S + S / 2, f.r * S + S / 2);
      const mx = (f.c + f.c2) / 2 * S + S / 2 + (Math.random() - 0.5) * S * 0.6, my = (f.r + f.r2) / 2 * S + S / 2 + (Math.random() - 0.5) * S * 0.6;
      ctx.lineTo(mx, my); ctx.lineTo(f.c2 * S + S / 2, f.r2 * S + S / 2); ctx.stroke();
    }
  }
  particles = particles.filter(p => (p.life += dt) < p.max);
  for (const p of particles) {
    p.vy += 9 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    const a = 1 - p.life / p.max, s = S * 0.09 * a + 1;
    ctx.fillStyle = `rgba(${p.col[0]},${p.col[1]},${p.col[2]},${a})`;
    const x = p.x * S, y = p.y * S;
    poly(ctx, [[x, y - s], [x + s * 0.6, y], [x, y + s], [x - s * 0.6, y]]); ctx.fill();
  }
  ctx.restore();

  floats = floats.filter(f => (f.t += dt) < f.life);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floats) {
    const k = f.t / f.life;
    ctx.globalAlpha = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
    ctx.font = `${Math.round(S * f.size)}px "Black Han Sans", "Malgun Gothic", sans-serif`;
    const y = (f.y - k * 0.8) * S;
    ctx.lineWidth = S * 0.09; ctx.strokeStyle = 'rgba(0,0,0,0.9)';
    ctx.strokeText(f.text, f.x * S, y);
    ctx.fillStyle = f.big ? colAccent : '#fff6e8';
    ctx.fillText(f.text, f.x * S, y);
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

// ---------- boot ----------
function snapshot() {
  return { level, score, moves, grid: settled() && !busy && !over ? grid.map(row => row.map(g => [g.t, g.sp])) : null };
}
try { window.claude?.hot?.snapshot?.(snapshot); } catch (e) {}
function start(data) {
  resize();
  if (data && data.level) startLevel(data.level, data.grid ? data : null);
  else startLevel(1);
  requestAnimationFrame(frame);
}
if (window.claude?.hot?.ready) window.claude.hot.ready(start);
else start(window.claude?.hot?.data ?? {});
document.fonts && document.fonts.ready.then(() => {});
})();
</script>
